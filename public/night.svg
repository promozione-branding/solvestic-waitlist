<svg width="600" height="560" viewBox="0 0 600 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEEFF8"/>
      <stop offset="1" stop-color="#B6B8DB"/>
    </linearGradient>
    <linearGradient id="night" x1="120" y1="80" x2="500" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26244F"/>
      <stop offset="1" stop-color="#4B4886"/>
    </linearGradient>
    <linearGradient id="jar" x1="220" y1="250" x2="380" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCDDEF"/>
    </linearGradient>
    <filter id="shadow" x="160" y="330" width="280" height="150" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="350" y="65" width="170" height="170" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Soft lavender card -->
  <rect x="18" y="18" width="564" height="524" rx="42" fill="url(#bg)"/>

  <!-- Night sky -->
  <rect x="52" y="52" width="496" height="410" rx="32" fill="url(#night)"/>

  <!-- Moon glow -->
  <circle cx="455" cy="135" r="65" fill="#B6B8DB" opacity=".18" filter="url(#glow)"/>
  <circle cx="455" cy="135" r="43" fill="#EEEFF8"/>
  <circle cx="474" cy="120" r="43" fill="#26244F"/>

  <!-- Stars -->
  <g fill="#EEEFF8">
    <path d="M125 130L130 143L143 148L130 153L125 166L120 153L107 148L120 143L125 130Z"/>
    <path d="M388 92L393 105L406 110L393 115L388 128L383 115L370 110L383 105L388 92Z"/>
    <path d="M493 218L497 228L507 232L497 236L493 246L489 236L479 232L489 228L493 218Z"/>
  </g>
  <g fill="#B6B8DB">
    <circle cx="172" cy="92" r="4"/>
    <circle cx="330" cy="145" r="3"/>
    <circle cx="438" cy="75" r="3"/>
    <circle cx="105" cy="220" r="3"/>
  </g>

  <!-- Botanical repair leaves -->
  <g fill="#B6B8DB" opacity=".82">
    <path d="M145 355C150 278 178 228 215 201C209 267 187 319 145 355Z"/>
    <path d="M166 316C190 280 216 265 244 262C224 294 199 313 166 316Z"/>
    <path d="M151 286C132 258 130 232 140 210C159 231 166 257 151 286Z"/>
  </g>
  <path d="M151 356C163 292 177 251 209 208" stroke="#EEEFF8" stroke-width="3" stroke-linecap="round" opacity=".55"/>

  <!-- Soft pedestal -->
  <ellipse cx="300" cy="446" rx="170" ry="30" fill="#26244F" opacity=".22" filter="url(#shadow)"/>
  <ellipse cx="300" cy="424" rx="175" ry="42" fill="#EEEFF8"/>
  <path d="M125 424H475V458C475 477 456 490 433 490H167C144 490 125 477 125 458V424Z" fill="#DCDDEF"/>

  <!-- Repair cream -->
  <path d="M344 391C365 368 397 363 419 375C408 397 384 409 354 407C344 405 338 399 344 391Z" fill="#FFFFFF"/>
  <path d="M352 392C375 390 393 383 410 371" stroke="#DCDDEF" stroke-width="5" stroke-linecap="round"/>

  <!-- Jar -->
  <rect x="202" y="267" width="196" height="142" rx="20" fill="url(#jar)"/>
  <ellipse cx="300" cy="267" rx="98" ry="17" fill="#EEEFF8"/>
  <rect x="211" y="238" width="178" height="48" rx="13" fill="#26244F"/>
  <ellipse cx="300" cy="238" rx="89" ry="13" fill="#4B4886"/>
  <ellipse cx="300" cy="409" rx="98" ry="16" fill="#B6B8DB" opacity=".55"/>

  <!-- Jar label -->
  <text x="300" y="326" text-anchor="middle" fill="#26244F"
        font-family="Georgia, serif" font-size="20" letter-spacing="4">SOLVESTIC</text>
  <text x="300" y="353" text-anchor="middle" fill="#55537A"
        font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5">NIGHT REPAIR</text>

  <!-- Small repair/moisture symbols -->
  <g fill="#8E91C4">
    <circle cx="237" cy="380" r="5"/>
    <circle cx="257" cy="386" r="3"/>
    <circle cx="363" cy="379" r="5"/>
  </g>

  <!-- Caption -->
  <text x="300" y="520" text-anchor="middle" fill="#26244F"
        font-family="Arial, sans-serif" font-size="14" font-weight="600"
        letter-spacing="2.5">NIGHT · REPAIR</text>
</svg>